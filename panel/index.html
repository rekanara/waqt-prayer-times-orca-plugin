<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Neobrutalism: thick ink borders, hard offset shadows, flat bright fills. */
      :root {
        --ink: #000;
        --bg: #e3f5ec;
        --surface: #fff;
        --text: #000;
        --muted: #3f5a4d;
        --sun: #ffc93c;
        --go: #22c55e;
        --border: 2px solid var(--ink);
        --shadow: 4px 4px 0 var(--ink);
        --display: 'Arial Black', 'Helvetica Neue', system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f2a22; --surface: #1b4034; --text: #fff; --muted: #b5d6c6; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px 14px 28px;
        font: 500 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .place { color: var(--muted); font-size: 12px; }
      .place b { color: var(--text); font-weight: 800; }

      /* The next prayer is the one loud thing on the panel. */
      .next {
        margin: 12px 0 8px;
        padding: 12px 14px 14px;
        background: var(--sun);
        color: #000;
        border: 3px solid var(--ink);
        border-radius: 6px;
        box-shadow: 6px 6px 0 var(--ink);
      }
      .next.now { background: var(--go); }
      .next .name { font: 16px/1.2 var(--display); }
      .next .time {
        font: 52px/1 var(--display);
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        margin: 6px 0 8px;
      }
      .next .left {
        display: inline-block;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        background: #fff;
        border: var(--border);
        border-radius: 4px;
        padding: 1px 7px;
      }

      /* The day as one bar from Subuh to Isya, with a diamond for now. */
      .track { position: relative; height: 30px; margin: 20px 4px 4px; }
      .track .rail { position: absolute; left: 0; right: 0; top: 9px; height: 12px; background: var(--surface); border: var(--border); border-radius: 3px; box-shadow: 2px 2px 0 var(--ink); }
      .track .done { position: absolute; left: 0; top: 9px; height: 12px; background: var(--go); border: var(--border); border-right-width: 0; border-radius: 3px 0 0 3px; }
      .track .tick { position: absolute; top: 4px; width: 3px; height: 22px; background: var(--ink); transform: translateX(-1.5px); }
      .track .tick.past { background: var(--ink); }
      .track .me { position: absolute; top: 7px; width: 16px; height: 16px; background: var(--sun); border: var(--border); transform: translateX(-8px) rotate(45deg); }

      .tabs { display: inline-flex; margin-top: 18px; border: var(--border); border-radius: 4px; box-shadow: 2px 2px 0 var(--ink); overflow: hidden; }
      .tabs button {
        font: 700 12px/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #000; background: #fff; border: 0; border-radius: 0; padding: 4px 10px; cursor: pointer;
      }
      .tabs button + button { border-left: var(--border); }
      .tabs button[aria-pressed='true'] { background: #000; color: #fff; }
      .tabs button:focus-visible { outline: 3px solid var(--go); outline-offset: -3px; }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 10px;
        font-variant-numeric: tabular-nums;
        background: var(--surface);
        border: var(--border);
        border-radius: 6px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      td { padding: 7px 12px; border-top: var(--border); font-weight: 700; }
      tr:first-child td { border-top: 0; }
      td.t { text-align: right; }
      tr.minor td { color: var(--muted); font-size: 12px; font-weight: 500; }
      tr.past td { color: var(--muted); font-weight: 500; }
      tr.current td { background: var(--sun); color: #000; font-weight: 900; }

      .foot { margin-top: 16px; color: var(--muted); font-size: 12px; }
      .error {
        margin-top: 12px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 600;
        color: #000;
        background: #ffd6d6;
        border: var(--border);
        border-radius: 6px;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .placebar { display: flex; align-items: center; gap: 8px; }
      .placebar .place { flex: 1; min-width: 0; }
      .placebar button, .picker button {
        font: 700 12px/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #000; background: #fff; border: var(--border); border-radius: 4px;
        padding: 3px 9px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer; flex-shrink: 0;
      }
      .placebar button:active, .picker button:active { transform: translate(2px, 2px); box-shadow: none; }
      .placebar button:focus-visible, .picker button:focus-visible { outline: 3px solid var(--go); outline-offset: 2px; }
      .picker {
        margin-top: 10px; padding: 10px; background: var(--surface);
        border: var(--border); border-radius: 6px; box-shadow: var(--shadow);
      }
      .picker label { display: block; font-weight: 800; margin-bottom: 6px; }
      .picker input {
        width: 100%; font: 600 13px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: 6px 8px; color: #000; background: #fff; border: var(--border); border-radius: 4px;
      }
      .picker input:focus-visible { outline: 3px solid var(--go); outline-offset: 1px; }
      /* Our own list, not <datalist>: Electron draws that popup outside the frame, unscrollable. */
      .picker .list {
        list-style: none; margin: 8px 0 0; padding: 0;
        max-height: 220px; overflow-y: auto; overscroll-behavior: contain;
        background: #fff; color: #000; border: var(--border); border-radius: 4px;
      }
      .picker .list li { padding: 6px 10px; border-top: 1px solid var(--ink); cursor: pointer; }
      .picker .list li:first-child { border-top: 0; }
      .picker .list li .c { color: #3f5a4d; font-size: 12px; }
      .picker .list li:hover { background: #e3f5ec; }
      .picker .list li[aria-selected='true'] { background: var(--sun); font-weight: 800; }
      .picker .list li.empty { cursor: default; color: #3f5a4d; background: none; }
      .picker .row { display: flex; gap: 8px; margin-top: 8px; }
      .picker .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
      /* Agents that need a look before stepping away: a button per workspace. */
      .agents { margin-top: 18px; }
      .agents h2 { font: 14px/1.2 var(--display); margin: 0 0 8px; }
      .agents ul {
        list-style: none; margin: 0; padding: 0; background: var(--surface);
        border: var(--border); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden;
      }
      .agents li + li { border-top: var(--border); }
      .agents button {
        display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
        font: 700 13px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--text); background: transparent; border: 0; padding: 8px 12px; cursor: pointer;
      }
      .agents button:hover { background: color-mix(in srgb, var(--go) 18%, transparent); }
      .agents button:focus-visible { outline: 3px solid var(--go); outline-offset: -3px; }
      .agents .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .agents .b {
        font-size: 11px; font-weight: 800; color: #000; white-space: nowrap;
        padding: 0 6px; border: var(--border); border-radius: 3px; background: var(--go);
      }
      .agents .b.permission { background: #ff5a5f; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="placebar">
      <div class="place" id="place"></div>
      <button id="changePlace" aria-controls="picker" aria-expanded="false"></button>
    </div>
    <div class="picker" id="picker" hidden>
      <label for="placeInput" id="placeLabel"></label>
      <input id="placeInput" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="placeList" autocomplete="off" spellcheck="false" />
      <ul class="list" id="placeList" role="listbox" aria-labelledby="placeLabel"></ul>
      <div class="row">
        <button id="placeAuto"></button>
        <button id="placeCancel"></button>
      </div>
      <div class="hint" id="placeHint"></div>
    </div>
    <div class="next" id="next" hidden>
      <div class="name" id="nextName"></div>
      <div class="time" id="nextTime"></div>
      <div class="left" id="nextLeft"></div>
    </div>
    <div class="track" id="track" hidden></div>
    <section class="agents" id="agents" hidden>
      <h2 id="agentsTitle"></h2>
      <ul id="agentList"></ul>
    </section>

    <div class="tabs" role="group" id="dayTabs">
      <button data-day="today" aria-pressed="true"></button>
      <button data-day="tomorrow" aria-pressed="false"></button>
    </div>
    <table><tbody id="rows"></tbody></table>
    <div class="foot" id="foot"></div>
    <div class="error" id="error" hidden></div>

    <script>
      'use strict'
      const plugin = window.orca.plugin
      const $ = (id) => document.getElementById(id)
      const PRAYERS = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha']
      let data = null
      let day = 'today'

      const STR = {
        id: {
          locale: 'id-ID', loading: 'Memuat jadwal…', today: 'Hari ini', tomorrow: 'Besok', days: 'Hari',
          soon: 'kurang dari 1 menit lagi', left: (h, m) => (h ? `${h} jam ` : '') + (m ? `${m} menit ` : '') + 'lagi',
          timeOf: (p) => `Waktu ${p}`, begun: 'Sudah masuk waktu', now: 'Sekarang', method: (m) => `Metode ${m}`,
          change: 'Ganti kota', search: 'Cari kotamu', auto: 'Otomatis (zona waktu)', cancel: 'Batal',
          pickHint: 'Ketik untuk mencari, lalu klik kota atau tekan Enter. Kota yang tidak ada: Settings → Plugins → Waqt → Other.', notFound: 'Tidak ada kota yang cocok.',
          agentsTitle: 'Agent kamu', permission: 'menunggu izin', working: 'bekerja', open: (n) => `Buka ${n}`, openError: (e) => `Workspace tidak bisa dibuka: ${e}`,
          error: (e) => `Jadwal tidak bisa dimuat: ${e}. Pastikan plugin aktif.`
        },
        en: {
          locale: 'en-GB', loading: 'Loading prayer times…', today: 'Today', tomorrow: 'Tomorrow', days: 'Day',
          soon: 'less than a minute left', left: (h, m) => (h ? `${h} h ` : '') + (m ? `${m} min ` : '') + 'left',
          timeOf: (p) => `${p} time`, begun: 'The prayer time has begun', now: 'Now', method: (m) => `Method: ${m}`,
          change: 'Change city', search: 'Search for your city', auto: 'Automatic (time zone)', cancel: 'Cancel',
          pickHint: 'Type to search, then click a city or press Enter. Not listed? Settings → Plugins → Waqt → Other.', notFound: 'No matching city.',
          agentsTitle: 'Your agents', permission: 'needs approval', working: 'working', open: (n) => `Open ${n}`, openError: (e) => `Couldn't open the workspace: ${e}`,
          error: (e) => `Couldn't load prayer times: ${e}. Check that the plugin is enabled.`
        }
      }
      const guess = /^(id|ms|in)\b/i.test(navigator.language || '') ? 'id' : 'en'
      const s = () => STR[(data && data.lang) || guess]

      function applyStatic() {
        document.documentElement.lang = (data && data.lang) || guess
        $('dayTabs').setAttribute('aria-label', s().days)
        document.querySelector('[data-day="today"]').textContent = s().today
        document.querySelector('[data-day="tomorrow"]').textContent = s().tomorrow
        $('changePlace').textContent = s().change
        $('placeLabel').textContent = s().search
        $('placeAuto').textContent = s().auto
        $('placeCancel').textContent = s().cancel
      }
      applyStatic()
      $('place').textContent = s().loading

      function leftText(ms) {
        const min = Math.max(0, Math.ceil(ms / 60000))
        if (min < 1) return s().soon
        return s().left(Math.floor(min / 60), min % 60)
      }

      function hijri(d) {
        try {
          return new Intl.DateTimeFormat(`${s().locale}-u-ca-islamic-umalqura`, { day: 'numeric', month: 'long', year: 'numeric' }).format(d)
        } catch { return '' }
      }

      function render() {
        if (!data) return
        applyStatic()
        const now = Date.now()
        const today = new Date()
        $('place').replaceChildren(
          document.createElement('b'),
          `, ${today.toLocaleDateString(s().locale, { weekday: 'long', day: 'numeric', month: 'long' })}`
        )
        $('place').firstChild.textContent = data.place

        // Next prayer, or the one that just began.
        const cur = data.current
        const justStarted = cur && now - cur.at < 15 * 60000
        const box = $('next')
        box.hidden = false
        box.className = justStarted ? 'next now' : 'next'
        if (justStarted) {
          $('nextName').textContent = s().timeOf(cur.label)
          $('nextTime').textContent = data.today.find((r) => r.key === cur.key).time
          $('nextLeft').textContent = s().begun
        } else if (data.next) {
          $('nextName').textContent = data.next.label
          $('nextTime').textContent = data.next.time
          $('nextLeft').textContent = leftText(data.next.at - now)
        }

        // Day track from Subuh to Isya.
        const marks = data.today.filter((r) => PRAYERS.includes(r.key))
        const start = marks[0].at
        const end = marks[marks.length - 1].at
        const pos = (t) => `${Math.min(100, Math.max(0, ((t - start) / (end - start)) * 100))}%`
        const track = $('track')
        track.hidden = false
        track.replaceChildren()
        const rail = document.createElement('div'); rail.className = 'rail'
        const done = document.createElement('div'); done.className = 'done'; done.style.width = pos(now)
        track.append(rail, done)
        for (const r of marks) {
          const t = document.createElement('div')
          t.className = 'tick' + (r.at <= now ? ' past' : '')
          t.style.left = pos(r.at)
          t.title = `${r.label} ${r.time}`
          track.append(t)
        }
        if (now >= start && now <= end) {
          const me = document.createElement('div'); me.className = 'me'; me.style.left = pos(now); me.title = s().now
          track.append(me)
        }

        // Agents that need a look (only when the worker could read them and some are busy).
        const agents = data.agents || []
        $('agents').hidden = !agents.length
        $('agentsTitle').textContent = s().agentsTitle
        $('agentList').replaceChildren(...agents.map((a) => {
          const b = document.createElement('button')
          b.setAttribute('aria-label', `${s().open(a.name)}, ${s()[a.state]}`)
          b.append(
            Object.assign(document.createElement('span'), { className: 'n', textContent: a.name }),
            Object.assign(document.createElement('span'), { className: `b ${a.state}`, textContent: s()[a.state] })
          )
          b.addEventListener('click', () => plugin.request('waqt.openWorkspace', { id: a.id }, { timeoutMs: 10000 }).catch((e) => {
            $('error').textContent = s().openError(e.message || e)
            $('error').hidden = false
          }))
          const li = document.createElement('li'); li.append(b)
          return li
        }))

        // Table.
        const rows = day === 'today' ? data.today : data.tomorrow
        $('rows').replaceChildren(...rows.map((r) => {
          const tr = document.createElement('tr')
          const minor = !PRAYERS.includes(r.key)
          let state = ''
          if (day === 'today') {
            if (cur && r.key === cur.key) state = 'current'
            else if (r.at < now) state = 'past'
          }
          tr.className = [minor ? 'minor' : '', state].filter(Boolean).join(' ')
          const a = document.createElement('td'); a.textContent = r.label
          const b = document.createElement('td'); b.className = 't'; b.textContent = r.time
          tr.append(a, b)
          return tr
        }))

        const h = hijri(today)
        $('foot').textContent = [h, s().method(data.method)].filter(Boolean).join('. ') + '.'
      }

      async function load() {
        try {
          data = await plugin.request('waqt.schedule', {}, { timeoutMs: 10000 })
          $('error').hidden = true
          render()
        } catch (e) {
          $('error').textContent = s().error(e.message || e)
          $('error').hidden = false
        }
      }

      // City search: a filtered, scrollable list. The worker only accepts ids it listed.
      let places = null // [{ id, name, country, key }]
      let shown = []
      let active = -1
      function filterPlaces() {
        const q = $('placeInput').value.trim().toLowerCase()
        if (!q) return places
        // Names starting with the query first, shortest first: "lon" puts London before Longyearbyen.
        const starts = places.filter((p) => p.lname.startsWith(q)).sort((a, b) => a.lname.length - b.lname.length)
        return starts.concat(places.filter((p) => !p.lname.startsWith(q) && p.key.includes(q)))
      }
      function setActive(i) {
        const items = $('placeList').children
        if (active >= 0 && items[active]) items[active].setAttribute('aria-selected', 'false')
        active = i
        if (i >= 0 && items[i]) {
          items[i].setAttribute('aria-selected', 'true')
          items[i].scrollIntoView({ block: 'nearest' })
          $('placeInput').setAttribute('aria-activedescendant', items[i].id)
        } else $('placeInput').removeAttribute('aria-activedescendant')
      }
      function renderPlaces() {
        if (!places) return
        shown = filterPlaces()
        active = -1
        $('placeInput').removeAttribute('aria-activedescendant')
        $('placeList').scrollTop = 0
        if (!shown.length) {
          $('placeList').replaceChildren(Object.assign(document.createElement('li'), { className: 'empty', textContent: s().notFound }))
          return
        }
        $('placeList').replaceChildren(...shown.map((p, i) => {
          const li = document.createElement('li')
          li.id = `place-${i}`
          li.setAttribute('role', 'option')
          li.setAttribute('aria-selected', 'false')
          li.append(p.name, Object.assign(document.createElement('span'), { className: 'c', textContent: `, ${p.countryName}` }))
          // mousedown keeps focus in the input; click alone would blur it first.
          li.addEventListener('mousedown', (e) => e.preventDefault())
          li.addEventListener('click', () => choosePlace(p.id))
          return li
        }))
        if ($('placeInput').value.trim()) setActive(0)
      }
      async function openPicker() {
        $('picker').hidden = false
        $('changePlace').setAttribute('aria-expanded', 'true')
        $('placeHint').textContent = s().pickHint
        $('placeInput').value = ''
        $('placeInput').focus()
        if (!places) {
          try {
            const list = await plugin.request('waqt.places', {}, { timeoutMs: 10000 })
            let region = (cc) => cc
            try { const dn = new Intl.DisplayNames([s().locale], { type: 'region' }); region = (cc) => dn.of(cc) || cc } catch {}
            places = list.map((p) => {
              const countryName = region(p.country)
              return { ...p, countryName, lname: p.name.toLowerCase(), key: `${p.name}, ${countryName}`.toLowerCase() }
            })
          } catch (e) {
            $('placeHint').textContent = s().error(e.message || e)
            return
          }
        }
        renderPlaces()
      }
      function closePicker() {
        $('picker').hidden = true
        $('changePlace').setAttribute('aria-expanded', 'false')
        $('changePlace').focus()
      }
      async function choosePlace(id) {
        try {
          data = await plugin.request('waqt.setPlace', { id }, { timeoutMs: 10000 })
          closePicker()
          render()
        } catch (e) {
          $('placeHint').textContent = s().error(e.message || e)
        }
      }
      $('changePlace').addEventListener('click', () => ($('picker').hidden ? openPicker() : closePicker()))
      $('placeCancel').addEventListener('click', closePicker)
      $('placeAuto').addEventListener('click', () => choosePlace('auto'))
      $('placeInput').addEventListener('input', renderPlaces)
      $('placeInput').addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault()
          if (!shown.length) return
          const step = e.key === 'ArrowDown' ? 1 : -1
          setActive(active < 0 ? (step > 0 ? 0 : shown.length - 1) : (active + step + shown.length) % shown.length)
        } else if (e.key === 'Enter') {
          e.preventDefault()
          const p = shown[active] || (shown.length === 1 && shown[0])
          if (p) choosePlace(p.id)
        }
      })
      $('picker').addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker() })

      plugin.on('waqt.tick', (next) => { data = next; render() })
      document.querySelectorAll('[data-day]').forEach((b) => b.addEventListener('click', () => {
        day = b.dataset.day
        document.querySelectorAll('[data-day]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)))
        render()
      }))
      setInterval(render, 15000) // keep the countdown moving between worker ticks
      load()
    </script>
  </body>
</html>
